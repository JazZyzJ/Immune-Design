# Wave-4 Round-2: A1 + near-EXACT-enriched candidate spectrum. Overrides the
# global negative sampler (train.yaml 0.95/5/0.5) to concentrate hard negatives
# at high IoU: 0.98 / offset 3 / hard_frac 0.6 -> hard negs cluster in
# IoU ~[0.67, 0.88]. Tests whether feeding the IoU-ranking loss more near-exact
# windows lifts IoU70 / exact-AP (where the head still trails NMP) — at the cost
# of fewer far anchors. Only this arm changes the negs; A1 baseline keeps 0.95/5/0.5.
train:
  hard_negative_fraction: 0.6
  hard_neg_max_overlap_ratio: 0.98
  hard_neg_offset_range: 3
  near_positive:
    enabled: false
    near_gap_max: 10
    schedule: ignore
    schedule_params: {}
    metric: endpoint_gap
    apply_to_span_negatives: false
    apply_to_residue_labels: false
  residue:
    enabled: true
    lambda_residue: 0.1
    label_mode: binary_coverage
    aggregation: log_mean_exp
    aggregation_params:
      beta: 4.0
    loss_mode: pairwise_margin
    margin_m_residue: 0.5
    window_mode: sampled
    max_windows_per_chunk: 1024
    min_far_bg_residues: 4
  loss:
    lambda_iou_rank: 1.0
    iou_rank_margin: 0.5
    iou_rank_min_gap: 0.1
