# Wave-2 sweep (base = cnn_himp_v1_npoff, the Wave-1 winner: near_positive OFF,
# residue ranking ON). Single-axis change: lambda_residue 0.1 -> 0.2.
# Goal: stronger residue ranking should lift IoU region AP without losing the
# density-Pearson dominance. near_positive stays OFF (Wave-1 showed it degrades
# the density landscape). Do not edit after a run consumes it.
train:
  near_positive:
    enabled: false
    near_gap_max: 10
    schedule: ignore
    schedule_params: {}
    metric: endpoint_gap
    apply_to_span_negatives: false
    apply_to_residue_labels: false
  residue:
    enabled: true
    lambda_residue: 0.2
    label_mode: binary_coverage
    aggregation: log_mean_exp
    aggregation_params:
      beta: 1.0
    loss_mode: pairwise_margin
    margin_m_residue: 0.5
    window_mode: sampled
    max_windows_per_chunk: 1024
    min_far_bg_residues: 4
