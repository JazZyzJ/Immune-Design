# Encoder ablation profiles for Module H.
# Frozen comparison constants: only encoder architecture/trainability/d_enc vary.
# All other head/loss/split/evaluation parameters are invariant.

ablation:
  # Allowed variable set for H
  variable_keys: [encoder_type, encoder_cfg, d_enc, trainable_encoder]

  profiles:
    LC1:
      encoder_type: multiscale_cnn
      d_enc: 256
      trainable_encoder: true
      encoder_cfg:
        token_emb_dim: 256
        n_blocks: 8
        dilations: [1, 2, 4, 8, 8, 4, 2, 1]
        hidden_channels: 256
        branch_channels: 64
        block_dropout: 0.1
      loss_overrides:
        objective_mode: mixed_margin
        margin_m: 0.5
        hard_topk: 4
        lambda_margin: 0.1

  # Frozen constants (must match train.yaml / model.yaml)
  frozen_constants:
    d_proj: 128
    scorer_hidden_dim: 256
    scorer_activation: gelu
    scorer_dropout: 0.3
    neg_ratio: 15
    hard_negative_fraction: 0.3
    min_k: 12
    max_k: 25
    loss_tau: 0.5
    context_len: 1022
    stride: 512
    margin: 32
    seeds: [42, 43, 44]
    monitor_metric: pp_auc
    profile: strict

  # Stage-I (Module I) frozen constants
  stage_i_frozen_constants:
    monitor_metric: pp_ap
    