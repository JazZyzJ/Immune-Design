# HIMP v1 ablation: residue supervision only (near_positive disabled).
# Isolates the contribution of residue ranking by leaving the legacy
# negative semantics intact. Compare against cnn_himp_v1.yaml to attribute
# improvement between near_positive vs residue.

train:
  near_positive:
    enabled: false
    near_gap_max: 10
    schedule: ignore
    schedule_params: {}
    metric: endpoint_gap
    apply_to_span_negatives: false
    apply_to_residue_labels: false

  residue:
    enabled: true
    lambda_residue: 0.1
    label_mode: binary_coverage
    aggregation: log_mean_exp
    aggregation_params:
      beta: 1.0
    loss_mode: pairwise_margin
    margin_m_residue: 0.5
    window_mode: sampled
    max_windows_per_chunk: 1024
    min_far_bg_residues: 4
