# Epitope Head v0 — Training Config
# Frozen decisions per PLAN.md Task E0 and codemap §8.3

train:
  # Negative sampling
  neg_ratio: 7
  hard_negative_fraction: 0.3
  hard_neg_max_overlap_ratio: 0.8
  hard_neg_offset_range: 5
  neg_length_sampling: match_positive  # match_positive | uniform

  # Loss
  loss:
    tau: 0.3            # InfoNCE temperature (v0: 0.1 caused overfitting; 0.3 stabilizes small-data regime)
    T_mp: 0.1           # multi-positive temperature (independent from tau)
    lambda_mp: 0.0      # multi-positive weight (disabled in v0)
    lambda_smooth: 0.0  # hotspot smoothness regularizer (disabled in v0)

  # Optimization
  lr: 3.0e-4            # (v0: 1e-3 too aggressive for ~340K-param head on frozen encoder)
  weight_decay: 1.0e-2  # (v0: 1e-4 insufficient with no dropout; raised for stronger L2)
  optimizer: adamw
  scheduler: cosine     # cosine | linear | constant
  warmup_steps: 500
  max_epochs: 50
  grad_clip: 1.0

  # Batching
  max_tokens: 4096      # token-budget dynamic batching
  num_workers: 4

  # Reproducibility
  seed: 42
  deterministic: false   # if true, use deterministic CUDA ops (slower)

  # Checkpointing
  checkpoint_every_n_epochs: 5
  early_stopping_patience: 5
  monitor_metric: loss_total    # (v0: logit_gap caused early stopping to never trigger)

  # Long-protein chunking (v1.1)
  chunking:
    enabled: true
    context_len: 1022    # ESM-2 max residues (1024 tokens - BOS - EOS)
    stride: 512
    margin: 32           # M >= kmax + 2 = 27
    stitch_mode: per_residue_stitch   # per_residue_stitch | center_weighted
    window_mode: per_residue_stitch   # per_residue_stitch | per_window_single_chunk
    enable_reliability: true
