criteria:
  # ============================ NOT SETTLED - DO NOT EXECUTE ON THESE ============================
  status_of_this_block: PROPOSED, awaiting agreement; see open_questions
  lock_set: >-
    TBD - v1 (24 interface anchors, 21% of the chain) was used for the cohort above and left a
    median of 41 mutations; v2 (interface + the 33-residue 8A shell = 57 residues, 50%) is proposed
  immune_gate: >-
    TBD - candidate rule is "no strong-binder window covers any interface anchor" (the parent
    itself FAILS this, with 6 anchors covered), plus a reduction in total strong-binder count
  structure_gate_monomer: >-
    TBD - monomer metrics are a foldability floor only, never evidence of binding
  complex_gate: >-
    TBD - proposed i_pAE and i_pTM on a re-predicted complex, normalized to the parent
  ddg_bind: >-
    TBD - whether to add FlexddG / SSIPe as an orthogonal point-mutation-sensitive arm
  mutation_budget: >-
    TBD - the literature that preserved function used 1-9 simultaneous mutations
  # ==============================================================================================

open_questions:
  - >-
    LOCK SET. Does RF re-run under lock v2 (interface + shell = 50% of the chain)? Evidence for:
    every successful redesign-preserving-function campaign in the literature worked by a hard
    POSITIONAL constraint, not a score gate (CoDAH forbade CDR mutations, 25/25 retained binding;
    Roguska resurfacing kept only RSA>30% surface; Salvat froze the active site, 18/18 functional).
    Roguska 1996 also calibrates the radius: replacing all three murine surface residues within 5 A
    of the CDRs LOST affinity, retaining any one restored it - our 8 A shell is more conservative.
    Our own cohort agrees: shell mutations correlate with structural degradation on all four
    metrics for 0401 (rho -0.17 to -0.26, p<=0.015) while non-shell non-interface mutations
    correlate with none (p>0.3). Cost: locking the shell removes ~16 of the ~41 median edits.
    Check that survives it: each epitope still retains 2-3 free MHC-II anchor pockets under v2.
  - >-
    COMPLEX GATE THRESHOLDS. BindCraft's defaults (i_pTM >= 0.50, i_pAE <= 0.35 == raw PAE 10.85 A)
    are the authors' own admitted defaults, "refined over the course of this work", with no
    ablation. Two independent optimizations say ~10 A is too loose: AlphaProteo's grid search over
    640k experimentally characterized designs put the optimum at pae_interaction < 7.0 with
    pLDDT > 90, and RFdiffusion used per-target cutoffs of 5-8 A. On BindCraft's own released
    data, tightening i_pAE 0.35 -> 0.20 raises the hit rate 42.8% -> 60.8% while retaining a third
    of designs. Our parent already sits at i_pAE 0.18 (raw 5.6 A).
  - >-
    WHICH PREDICTOR. BindCraft's validated thresholds are bound to AF2-monomer-single-sequence with
    templates; the authors report that AF3-class models gave a large proportion of false positives
    in the same role. Our complex gate currently uses Protenix, an AF3 reproduction. Either add an
    AF2-monomer reprediction to inherit the calibrated thresholds, or accept self-calibrated ones
    with no experimental anchor.
  - >-
    DROP THE STATIC ROSETTA DESCRIPTORS? AUROC computed from BindCraft's own 152 labelled designs
    (65 binders / 87 non-binders, target-stratified): i_pAE 0.769, Binder_RMSD 0.752, i_pTM 0.746,
    i_pLDDT 0.741 - but ShapeComplementarity 0.532, n_InterfaceHbonds 0.523, n_InterfaceResidues
    0.509, dSASA 0.508, Hotspot_RMSD 0.548, every CI spanning 0.5. Cao 2022 independently sees all
    Rosetta metrics collapse to 0.55-0.61 within-target.
  - >-
    ...BUT THAT IS A DIFFERENT TASK FROM OURS, WHICH IS THE UNSOLVED ONE. Those AUROCs discriminate
    binder from non-binder. Ours is parent vs mutant, and on that task the ranking inverts: on
    SKEMPI (475 mutants) delta-AF2 mean_pae gives AUC 0.54 (random) and delta-AF3 ipTM 0.72, while
    FoldX 0.74, FlexddG 0.77 and SSIPe 0.78 do better. AF2 is also structurally blind to
    destroying mutations - hHR23a L198A is experimentally disordered yet gives Ca RMSD 0.1 A and
    pLDDT 84 for both WT and mutant. No published Delta-metric acceptance rule for "this mutant
    still binds" exists in any form.
  - >-
    STAGING. Start with 1501 only (both epitope cores are entirely off-interface) or both alleles
    at once? Zhao 2015 removed all 16 DR4 epitopes from lysostaphin simultaneously and got no
    folded, functional enzyme - four rounds of directed evolution were needed to recover.
  - >-
    ORDER SIZE. Budget for attrition from comparable campaigns: Blazanovic 7/14 expressed at >=30%
    WT, King 3/5 retained PE38 activity, Onda screened >50 mutants to land 8.

