notes:
  - >-
    THE COHORT ABOVE IS A TOLERANCE MAP, NOT A CANDIDATE POOL. Its 68 joint-loose survivors carry
    33-50 mutations. Every literature campaign that de-immunized a protein and kept its function
    did so with 1-9 simultaneous mutations. These 400 designs are the empirical answer to "which
    positions of this binder tolerate change", which is what should inform the lock set - they are
    not sequences to order.
  - >-
    A BINDER IS AN ENZYME WHOSE ACTIVE SITE IS ITS ENTIRE SURFACE PATCH. The analogy to the
    ADA/ADI cases holds for the architecture (manifest of frozen functional residues -> RF ->
    refinement) and breaks on two axes. Proportion: uricase freezes 8/300 = 3%, this binder needs
    21-50%. Verification: an enzyme's catalytic geometry is checkable in a monomer refold because
    it is buried and rigid; a binder's interface is solvent-exposed and its partner is absent, so
    NO amount of monomer evidence bears on binding. The gate must move into the complex - the
    binder analogue of cofolding Zn/PRH/adenosine is a 2-chain complex prediction.
  - >-
    MONOMER ANCHOR METRICS HAVE ALMOST NO RESOLVING POWER HERE, and an absolute threshold borrowed
    from the enzyme cases would have failed all 400 designs. The parent's OWN worst core-anchor
    sidechain RMSD is 4.00 A (vs 0.265-0.341 A for the ADA finals) because the statistic is a
    max over a set containing (a) an N-terminal segment disordered when free and ordered on
    binding, and (b) surface Arg/Gln rotamers a monomer apo refold cannot pin down. Anchors 0-4
    sit in that mobile segment; anchor 15 is a Gly with no sidechain. This is the same exact-parent
    normalization principle as the ADA case, reached through a different mechanism.
  - >-
    THE INTERFACE-OVERLAP CRITERION SHOULD BE EVALUATED AT THE BINDING-CORE ANCHOR POCKETS, NOT THE
    COVERED SPAN. A 15-mer strong window covering interface residues is not itself a conflict; what
    matters is whether the P1/P4/P6/P9 pockets - the positions you must actually mutate - overlap
    the interface. For 0401 the covered span touches 6 anchors but only P9 (G15) is an anchor,
    leaving P1/P4/P6 free; for both 1501 cores no pocket touches the interface at all. Both alleles
    are therefore separable. The 200 designs confirm the mechanism empirically: among the 106
    epitope-free 0401 designs, the positions consistently changed are P4 (idx 10, 69/106) and
    P6 (idx 12, 97/106) - the canonical anchor pockets.
  - >-
    FIRST-IN-FIELD, WITH NO THRESHOLD TO BORROW. No published study de-immunizes a de novo designed
    binder and re-measures target binding. The nearest work (Yachnin 2021, Rosetta MHCEpitopeEnergy)
    uses a designed HA-binding protein as a case study but never leaves the computer. Every
    experimentally validated MHC-II epitope removal (sfGFP, PE38, P99 beta-lactamase, EPO,
    staphylokinase, human ZF junctions) used a non-binding readout.
  - >-
    THE PREMISE IS ALSO WEAKLY EVIDENCED, IN BOTH DIRECTIONS. "de novo miniproteins are immune
    silent" rests on two unlabeled bar charts (Chevalier 2017 Fig 5c, n=5 mice; Silva 2019 ED Fig 5,
    n=10, "performed once"). But every study reporting per-animal ADA found positives: 1/10 for
    LCB1v1.3, and 5/30 for the de novo IL-21 mimic 21h10 with incidence rising over repeat dosing.
    No human ADA data exists for any de novo binder. So the work is justified, and its motivation
    should be stated as such rather than as a solved fact.
  - >-
    KNOWN DATA-PREP DEFECT, NOT YET FIXED: the binder chain was extracted from the Protenix complex
    CIF into PDB_ROOT without carrying B-factors, so the structural eval reports
    reference_pLDDT = 0.00. Coordinates are unaffected and no gate consumed it, but the reference
    confidence baseline is missing. Rewrite the PDB with B-factors before the next round.
  - >-
    No selection PROTOCOL exists for binder targets yet; `protocol` and `runner` point at the
    data-prep SOP, which is what actually governed the completed stage. Writing
    PROTOCOL/binder_interface_deimm_selection.md is the deliverable that closes this case.
