schema_version: pd1_binder_interface_v0
description: 'PD1_b2 de novo binder (BindCraft) - PD-1 interface hard-anchor constraint. Unlike an enzyme
  target, this binder''s direct-functional set is its BINDING INTERFACE, so anchors are derived from a
  predicted complex, not from a monomer or a collaborator residue list. Interface reproducibility across
  the ensemble: pairwise Jaccard median 0.882, min 0.846; complex ipTM 0.951, pTM 0.953, no clashes. 21/24
  anchors are present in all 5 samples (G15/Q43 4/5, K18 3/5 - kept per the safety-max convention; their
  occupancy is recorded in biological_role so a later run can relax them deliberately).'
target_annotation:
  target: PD1_ECTO_Q15116_33_150
  uniprot: Q15116
  construct_1b:
  - 33
  - 150
  target_side_contacts_uniprot_1b:
  - 62
  - 63
  - 64
  - 66
  - 75
  - 78
  - 83
  - 85
  - 86
  - 87
  - 88
  - 126
  - 128
  - 129
  - 130
  - 131
  - 132
  - 133
  - 134
  - 135
  - 136
  note: The contacted PD-1 face (62-66, 75-78, 83-88, 126-136) is the PD-L1-binding surface, i.e. this
    binder is PD-L1-competitive.
structure_provenance:
  backbone: bound-state binder chain from the top-ranked complex sample
  rationale: apo and bound cores agree (5-104 Ca RMSD 0.69 A) but the N-terminus 0-9 is mobile in apo
    (intra-apo ensemble spread 1.75 A vs 0.23 A for the complex) and is ordered on binding; anchors 0-4
    sit in that segment, so the apo backbone would place 5 of 24 interface residues arbitrarily.
