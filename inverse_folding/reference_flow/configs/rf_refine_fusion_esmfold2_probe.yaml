# Minimal real-oracle probe for the ESMFold2 live Fusion backend.
# One initial structure and at most one round-1 candidate are folded. Thresholds
# are deliberately permissive: this config validates runtime integration, not a
# production structure gate or scientific operating point.
fusion:
  enabled: true
  seed: 20260712
  population_size: 1
  n_rounds: 1

  handoff:
    mode: terminal_population

  targeting:
    mode: head_max_window
    registers_per_parent: 1
    halo_radius: 4

  objective:
    head_field: global_risk
    min_head_improvement: 0.0
    max_offtarget_window_increase: 100.0

  moves:
    explicit:
      enabled: true
      max_edit_order: 1
      max_raw_candidates_per_parent: 8
      pair_seed_budget: 0
    rf_reopen:
      enabled: false
      children_per_parent: 0
    repair:
      enabled: false
      repair_shortlist_per_parent: 0
      children_per_edit: 0
      sampler_steps: 0
      local_remask: false

  structure:
    backend: esmfold2_live
    surrogate_mode: none
    scTM_min: 0.01
    active_site_metric: sidechain_max_anchor
    max_anchor_sidechain_RMSD_max: 100.0
    active_site_RMSD_max: null
    active_site_shell_radius: 6.0
    scRMSD_max: null
    cache_dir: structure_cache
    max_refolds_per_parent: 1

  selection:
    mode: greedy
    beta_start: 1.0
    beta_end: 1.0
    resample_method: multinomial

  telemetry:
    candidate_detail: true
    window_detail: false
    trajectory_detail: true
