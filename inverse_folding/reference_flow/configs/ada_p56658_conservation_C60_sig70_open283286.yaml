  unlock_rationale: 'DIRECT evidence, not inference. All 79 core_count_after==1 designs from rounds 2 and 3 carry
    the SAME single residual DRB1*04:01 core: the 9-mer FK?DQVNYS at 283-291. refine.extract_target_cores only mutates
    a core''s MHC-II pocket positions (core_start + 0/3/5/8 = 283/286/288/291) minus anchors; all four are locked,
    so editable_positions is EMPTY and the beam loop cannot start -- which is exactly what the 86/88/90 rescue showed
    (75/75 seeds returned unchanged, 0 mutations). All four pockets are flagged ONLY by sigma_L coevolution: none
    is in the C>=0.60 conservation set and none is in the functional hard25 catalytic set. P1(283) and P4(286) are
    released first because they sit 9-12 residues from the Zn-coordinating Asp295, whereas P9(291) is only 4 residues
    away; 288 and 291 stay locked unless this step fails.'
