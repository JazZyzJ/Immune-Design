# RF-Refine Fusion — P2 (H3) EXPLICIT-ONLY arm (matched-budget control for the repair arm).
#
# Identical to rf_refine_fusion_p2_repair.yaml EXCEPT moves.repair.enabled=false. n_rounds=8
# (matched budget; >= both elbows: explicit ~r6, repair ~r7). Same 76 P1-ok high-risk proteins,
# scTM_min 0.85, N_H 0.10, N=4, esmfold2_live. This is the explicit-greedy control; the ONLY
# difference vs the repair arm is repair.enabled -> the H3 comparison is not confounded.
fusion:
  enabled: true
  seed: 20260715
  population_size: 4
  n_rounds: 8

  handoff:
    mode: terminal_population

  targeting:
    mode: head_max_window
    registers_per_parent: 1
    halo_radius: 4

  objective:
    head_field: global_risk
    min_head_improvement: 0.05
    max_offtarget_window_increase: 0.10

  moves:
    explicit:
      enabled: true
      max_edit_order: 2
      max_raw_candidates_per_parent: 200
      pair_seed_budget: 32
    rf_reopen:
      enabled: false
      children_per_parent: 0
    repair:
      enabled: false                       # <-- the ONLY difference vs the repair arm
      repair_shortlist_per_parent: 4
      children_per_edit: 4
      sampler_steps: 8
      local_remask: false

  structure:
    backend: esmfold2_live
    surrogate_mode: none
    scTM_min: 0.85
    active_site_metric: sidechain_max_anchor
    max_anchor_sidechain_RMSD_max: 2.0
    active_site_RMSD_max: null
    active_site_shell_radius: 6.0
    scRMSD_max: null
    cache_dir: structure_cache
    max_refolds_per_parent: 8

  selection:
    mode: greedy
    beta_start: 1.0
    beta_end: 4.0
    resample_method: multinomial

  telemetry:
    candidate_detail: true
    window_detail: false
    trajectory_detail: true
