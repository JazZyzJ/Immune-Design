# Breadth-S1 arm: B1 high-risk with a WIDER per-block editable cap.
# Copy of d2_d3_full_stageB_aopen.yaml (the B1 baseline) with EXACTLY ONE knob
# changed: controller.d2.max_positions_per_block 4 -> 6.
#
# Why (PLANNER_README.md §Breadth-S1 / Self-Cond_GR.md §8.4): C0b (RAR 0022/0023)
# showed the immune-reduction lever is BREADTH (wider joint-scored independent
# edits per block), not coordination. This sweep arm tests whether D2, editing
# more positions per block, realizes closed-loop immune reduction beyond B1's
# 4-position cap AT HELD scTM. Everything else is fixed vs the B1 base:
# max_candidates_per_block=4096 (the wide-tuple sampled path is used),
# min_ess_fraction=0.0, beta=3.0, global_pressure off.
controller:
  enabled: true
  mode: d2_d3_full
  t_start: 0.50
  refresh_interval: 5
  completion:
    method: argmax
  head:
    score_scale: raw_logit
    static_cache_policy: lazy_write
    local_risk_aggregation: LME
  active_windows:
    excess_threshold: 0.0
    max_windows: 16
    selection: threshold_then_top_n
    merge_overlapping_scoring_windows: true
  reliability:
    time_k: 20.0
    entropy_h0: 1.5
    min_completion_fraction: 0.0
    min_rho_to_emit_event: 0.0
  d2:
    enabled: true
    beta: 3.0
    eta: 0.7
    struct_temperature: 1.0
    delta_struct: 3.0
    context_pnll_h0: 2.0
    context_jsd_h0: 0.5
    epsilon: 1.0e-8
    candidate_mode: structure_topk
    top_k_tokens: 8
    max_positions_per_block: 6
    max_candidates_per_block: 4096
    selection_score: residue_excess_then_low_entropy
    min_delta_R_improvement: 0.0
    min_ess_fraction: 0.0
    max_abs_logit_shift: 10.0
    paired_uncorrected_sample: true
    completion_ensemble_enabled: true
    completion_ensemble_size: 3
    completion_ensemble_scope: local_windows
    completion_ensemble_rescore_top_m: 8
    completion_ensemble_use_variance_gate: false
    sticky_ttl_steps: 5
    sticky_clear_on_selected: true
    sticky_clear_on_remask: true
    sticky_overwrite_on_refresh: true
  d3:
    enabled: true
    window_to_residue_projection: max_covering_window
    gamma_min: 0.40
    gamma_max: 0.90
    lambda_commit: 1.0
    alpha_struct: 0.3
    d2_evidence_nu: 1.0
    d2_evidence_ttl_steps: 5
    d2_evidence_requires_benefit: true
    zscore_epsilon: 1.0e-6
    same_refresh_grace: true
    final_freeze_steps: 1
    evidence_source: legacy_window_excess
  attribution:
    write_paired_counterfactual: true
    write_independent_delta_R_i: true
    productive_delta_logp: 0.5
  controls:
    allow_wrong_allele_head: true
    allow_shuffled_head: true
  telemetry:
    write_refresh_log: true
    write_controller_events: true
    write_per_protein_summary: true
  targeting:
    mode: typed_actionability
    tau_ref_source: static_median
    tau_ref_quantile: 0.50
    projection: max_covering_window
    env_seed_top_current: 16
    env_seed_top_uncertain: 16
    env_seed_max_windows: 32
    env_ensemble_size: 3
    env_consistency_floor: 0.3333333333
    softor_tau: 0.5
    r_ctx_floor: 0.25
    mem_half_life_refreshes: 3
    mem_cold_start: zero
    cluster_radius: 4
    cluster_min_mass: 3.0
    cluster_floor: 0.25
    use_cluster_for_active_blocks: false
    active_window_source: v_target
    active_window_min_excess: 0.0
    # Stage B.1 (PLAN_RF_UNI_CTRL.md 1438 / RAR 0006 M7): route within-block
    # editable-position ranking to v_target so the typed signal reaches the D2
    # position layer. This makes d2_d3_full_stageB_aopen.yaml the B.1 mechanism
    # run; the matched static comparator keeps within_block_source=legacy_excess.
    within_block_source: v_target
    write_actionability_telemetry: true
  global_pressure:
    enabled: false
    g_min: 0.25
    g_max: 1.0
    G0_source: stageB_pilot_median
    s_G_source: stageB_pilot_iqr_half
