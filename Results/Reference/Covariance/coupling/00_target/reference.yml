# Reference facts for the uricase coupling analysis. Every downstream script reads this.
# Derived and verified 2026-07-20 — do not edit by hand without re-running the checks noted.

target:
  uniprot: Q00511            # URIC_ASPFL, Aspergillus flavus uricase (urate oxidase, uaZ)
  fasta: 00_target/Q00511.fasta
  length_uniprot: 302        # includes initiator Met
  length_mature: 301         # Met cleaved; mature Ser1 is N-acetylated (modelled as SAC in 1R4U)

# ---------------------------------------------------------------------------
# NUMBERING — the single most dangerous detail in this project.
#
# The uricase literature AND the PDB entries number residues on the MATURE
# protein (initiator Met removed). UniProt Q00511 includes Met1. Therefore:
#
#     mature/PDB/literature position  ==  UniProt position - 1
#
# Verified two independent ways:
#   1. 17 literature active-site residues: 16/17 match mature numbering, 0/17 UniProt.
#   2. PDB 1R4U chain A: 294/294 modelled residues match mature numbering, 9/294 UniProt.
#
# All score tables carry BOTH columns explicitly. Masks are emitted in mature
# numbering (matches any uricase structure you will hand to an inverse-folding
# model) with the UniProt column alongside for cross-reference.
# ---------------------------------------------------------------------------
numbering:
  convention: mature
  mature_equals_uniprot_minus: 1

structure:
  pdb_id: 1R4U
  file: 00_target/1r4u_assembly1.cif    # biological assembly, NOT the asymmetric unit
  description: A. flavus urate oxidase + oxonic acid (uric-acid analog inhibitor)
  resolution_angstrom: 1.65
  oligomeric_state: tetramer
  chains: [A, A-2, A-3, A-4]
  note: >
    The asymmetric unit of 1R4U holds ONE chain; the tetramer is generated by
    crystallographic symmetry. Always use the -assembly1 file, otherwise every
    cross-subunit contact silently disappears.
  ligands:
    OXC: oxonic acid, bound in the active site (resseq 999)
    SAC: N-acetyl-serine, the modified mature N-terminus (resseq 1)

# ---------------------------------------------------------------------------
# GROUND-TRUTH ACTIVE SITE — derived from the structure, not from literature recall.
# Residues with any heavy atom within 4.5 A of the OXC ligand, in mature numbering.
#
# 7 of 15 (47%) are donated by the ADJACENT subunit. This is the whole reason the
# paper's evolutionary masking beats a structural distance cutoff: a monomer-based
# mask misses half the catalytic machinery, while an intra-family Potts model
# cannot tell intra- from inter-chain contacts and so captures both.
#
# The literature list independently reproduces this set (Tyr8, Lys10, Ile54, Ala56,
# Thr57, Asp58 cross-subunit; Phe159, Leu170, Arg176, Ser226, Val227, Gln228,
# Asn254, His256 same-chain). A stray "Asn154" seen in one secondary source is
# spurious — mature 154 is Ser; the real residue is Asn254.
# ---------------------------------------------------------------------------
active_site_4p5A:
  same_chain:  [159, 170, 176, 226, 227, 228, 254, 256]
  cross_chain: [8, 10, 54, 55, 56, 57, 58]

# Catalytic dyad specifically called out in the mechanism literature.
# Note BOTH members come from the neighbouring protomer relative to the bound substrate.
catalytic_dyad: [10, 57]     # Lys10*-Thr57*

# C-terminal peroxisomal targeting signal (PTS1). Relevant only if peroxisomal
# import matters for your construct; for a secreted/therapeutic enzyme it does not.
pts1:
  mature_positions: [299, 300, 301]
  sequence: SKL
