  catalytically plausible, by running the full holo tier stack T0-T3 on the 0-NMP refinement
  shortlist. ADA is the MAXIMAL instantiation of the holo protocol: a required metal cofactor
  (Zn2+), a transition-state analogue (PRH) reporting the closed pocket, and a physiological
  substrate (adenosine) - three ligand states, each gating a different tier.
