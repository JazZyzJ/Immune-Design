notes:
  - >-
    THIS IS THE PROTOCOL'S WORTH, IN ONE DATA POINT. Candidate d0219 passed T0 (apo structure)
    and had n_strong_NMP = 0, i.e. it was indistinguishable from the survivors on every monomer
    and immune metric. It was rejected only because cofolding the Zn pulled Asp295 OD1 to 2.52 A,
    outside the coordination band, in 3 of 5 samples. Without the holo tier it would have been
    ordered.
  - >-
    IMPLEMENTATION IS STRICTER THAN THE PROTOCOL TEXT for Asp295. The protocol states an operational
    band of 1.9-2.6 A for Asp295 OD1 (1.9-2.5 for the three His NE2), but analyze_cand_holo.py
    applies 1.9-2.5 to all four atoms. d0219's 2.52 A therefore fails the implemented gate while
    sitting inside the protocol's stated Asp295 band. Reconcile before the next campaign - the
    single rejection of this cohort turns on it.
  - >-
    T2 must be WT-normalized, not crystal-normalized: exact-WT itself recovers only 13/15 of the
    1KRM experimental contacts (Jaccard 0.72), so a crystal-absolute T2 bar would fail the positive
    control. The achievable ceiling is the intra-WT Jaccard 0.89.
  - >-
    T3 was PROMOTED from monitor to discriminator for this campaign only, because the WT adenosine
    dispersion (pairwise ligand RMSD median 0.10 A, contact Jaccard 0.95 over 10 samples) cleared
    the pre-registered admissibility bar. This promotion is per-campaign and must be re-decided
    whenever the predictor, MSA source, or ligand set changes.
  - >-
    Gly is an anchor with no sidechain, so matched_anchor_count reads 24/25 for every design
    (match_status = no_sidechain). Expected, not a defect, not a discriminator.
  - >-
    No PROTOCOL/holo_catalytic_gate_calibration.runner.md exists yet; the `runner` field points at
    the shell script that was actually executed. Writing the runner is the open item that would let
    this protocol be re-run without re-deriving the procedure.
  - >-
    Evidence boundary: these are COMPUTATIONAL candidates (NMP = 0 plus retained catalytic geometry).
    Neither de-immunization nor activity is experimentally confirmed; donor PBMC / CD4 T-cell assays
    and an enzyme-activity assay are still required.
