notes:
  - >-
    Excluded before submission: 6TN1_AAA had no .pdb under PDB_ROOT (its reference is a .cif).
    Restored the same day after the test-set row was corrected; verified end-to-end through
    resolve_structure_path then prepare_reference_context (497 residues, matching the test-set
    sequence_length) before resubmitting from the SAME frozen selection table. Nothing re-selected.
  - >-
    The refinement Head is the generation's Head, byte-identical (sha 12e8018f...). Refining
    against a CV fold or a full-data run's leaky best.pt would change the objective mid-pipeline.
  - >-
    structure_failed_best_sctm and wild_type_seed are DIAGNOSTIC, not product. Their seeds start
    below the generation structure floor of scTM 0.70. Filter on seed_group before reporting any
    product-level number.
  - >-
    ESMFold2 is not deterministic at these settings (40 designs folded twice: |dscTM| median
    0.0024, max 0.121, 0/40 exact). Compare distributions, not individual designs; a refinement
    delta_scTM of the same order as this noise means not distinguishable, not degraded.
  - >-
    Patience has no minimum-improvement epsilon, unlike generation's epsilon_R=0.005. MAX_ROUNDS
    was non-binding on the 0701 cohort (median 4, max 7, 0/654 at the cap) but that is an
    empirical observation, not a guarantee.
