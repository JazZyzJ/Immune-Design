criteria:
  # ============================ STAGE 1 - LOCK SET (the core of v2) ============================
  lock_n_contact_anchors: 24
  lock_n_support_shell: 33
  lock_total: 57
  lock_fraction_of_chain: 0.50
  n_designable_positions: 57
  contact_cutoff_ang: 4.0
  shell_cutoff_ang: 8.0
  consensus_frac: 0.6

  # --- lock-set admissibility: free MHC-II anchor pockets remaining per epitope (>=1 required) ---
  admissibility_drb0401_LDPDSTDPG: P4 (idx0b 10) and P6 (idx0b 12) free; P1 (7) in shell, P9 (15) is a contact anchor
  admissibility_drb1501_LVKYLGISR: P6 (idx0b 57) and P9 (idx0b 60) free; P1 (52) and P4 (55) in shell
  admissibility_drb1501_PAAYAALAA: P1 (idx0b 78), P4 (81) and P6 (83) free; P9 (86) in shell
  admissibility_verdict: all three epitopes retain >= 2 free anchor pockets - lock set is ADMISSIBLE

  # ============================ STAGE 2 - TIERS ============================
