notes:
  - >-
    WHY v2 EXISTS, IN ONE MEASUREMENT. The v1 cohort's strictest structural survivors still mutate
    17/33 (0401) and 15/33 (1501) shell positions and still carry 40 and 37 total mutations - the
    same as the cohort median. Testing whether the strict gate selected for shell preservation:
    Mann-Whitney p = 0.827 for 0401 (no relationship at all) and p = 0.003 for 1501 but with an
    effect of one position. So selection did NOT deliver the constraint. A gate picks the
    best-scoring member of a heavily perturbed pool; it cannot make the pool less perturbed.
  - >-
    EVIDENCE FOR FREEZING THE SHELL, from three independent directions. (1) Literature: Roguska 1996
    replaced all three murine surface residues within 5 A of the CDRs and lost affinity; retaining
    any one restored it. (2) Our own v1 cohort: shell mutation count correlates with degradation on
    all four structural metrics for 0401 (rho -0.17 to -0.26, p <= 0.015) while non-shell
    non-interface mutations correlate with none (p > 0.3) - a within-experiment control, which is
    what makes a rho of 0.2 worth acting on. (3) The admissibility check passes: all three epitopes
    keep >= 2 free anchor pockets, so the de-immunization capability is not reduced by the lock.
  - >-
    B2 WAS SPECIFIED WITH THE WRONG STATISTIC, AND THE COHORT SHOWED IT. A symmetric Jaccard punishes
    gaining interface contacts as hard as losing the parent's, but only loss is damage. Across the
    400 designs, Spearman of Jaccard against contacts LOST was -0.381 and against contacts GAINED
    -0.954: the metric was 95% a measure of extra buried surface. The original Jaccard >= 0.85 rule
    would have rejected 81/400, nearly all for gaining contacts, while 370/400 lost NONE of the
    parent's 21. Replaced by retention (lose <= 1). The gains are additive rather than a relocated
    interface - complex TM vs parent stays at 0.983 median and BSA rises to 1.052x.
  - >-
    B2'S BAR CAME FROM THE WRONG REFERENCE CLASS TOO. A design's number is consensus-vs-consensus,
    so the parent's SAMPLE-level pairwise Jaccard (median 0.808, min 0.731) is not the bar - it
    measures raw noise the 60% occupancy filter already removes. The apples-to-apples reference is
    the parent's leave-one-out CONSENSUS stability, which is 1.000. Caveat on that estimate: with 5
    samples and frac 0.6, ceil(0.6*4) = ceil(0.6*5) = 3, so part of the stability is threshold
    arithmetic rather than measured robustness.
  - >-
    THE HONEST v1-vs-v2 COMPARISON IS A TRADE, NOT A WIN. On the same "folds AND zero strong
    binders" criterion the LOOSER v1 lock set produced MORE joint winners: 48 vs 41 on DRB1*04:01
    and 43 vs 34 on DRB1*15:01. v2 bought a median of 23-24 mutations instead of 40, 0 of 33
    support-shell positions mutated instead of 16, and measured complex-level interface retention
    where v1 had no binding evidence at all. Whether ~20% fewer candidates is worth that depends on
    accepting mutation count as a risk variable (principle 6); the numbers do not settle it.
  - >-
    ROSETTA'S INTERFACE ENERGY WAS NOISE ON THIS TARGET, MEASURED. The parent's own dG_separated is
    +133.12 REU on the Blackwell prediction and +9.45 REU on the H200 one - same sequence, same
    seed, 124 REU apart - and 368/400 designs "beat" the parent. A metric 92% of mutants outperform
    the wild type on is not measuring binding. Spearman against mutation count: i_pTM -0.201,
    complex TM -0.175, but BSA ratio -0.004, packstat +0.023, shape complementarity -0.050. This
    reproduces the B3 AUROC table's conclusion on our own target rather than by citation.
  - >-
    THE PREDICTOR'S GPU ARCHITECTURE IS PART OF "THE IDENTICAL PROTOCOL". The same parent JSON, the
    same seed 101 and the same 5 samples give i_pTM 0.9552 on RTX PRO 6000 Blackwell (torch
    2.7.1+cu128) and 0.9507 on ailab H200 (torch 2.x+cu126) - a shift of 0.0046, which is ELEVEN
    TIMES the 0.0004 within-ensemble spread that the same metric has to resolve. Neither number is
    more correct; they are the same weights under different kernels. The consequence is operational:
    a parent baseline measured on one architecture cannot normalize designs predicted on another.
    This run is self-consistent because the Blackwell smoke wrote the WT prediction into the same
    pred root the designs use, so the gate's _ratio_to_wt columns compare like with like. pTM
    (+0.0012) and pLDDT (-0.086 on a ~93.5 scale) shift far less and are not at risk.
  - >-
    THE i_pTM NON-INFERIORITY TRAP. Protenix's i_pTM across the five parent samples spans 0.0004
    (0.950319-0.950733). A parent-normalized tolerance built from that spread would be a zero-width
    gate that rejects essentially everything. B1 must therefore rest on an ABSOLUTE floor for this
    predictor, which is exactly the situation the protocol's principle 3 warns about - measure the
    parent's dispersion first, then decide the metric's role.
  - >-
    THE PROTENIX PATH IS SELF-CALIBRATED AND SHOULD BE LABELLED AS SUCH. BindCraft's thresholds
    (i_pTM >= 0.50, i_pAE <= 0.35) are bound to AF2-monomer single-sequence with a templated target,
    and its authors report AF3-class models producing a large fraction of false positives in the
    same filtering role. Protenix is an AF3 reproduction. Adding an AF2-monomer reprediction is the
    only way to inherit thresholds that have an experimental anchor; the b1_af2_repredict_* values
    above are written for that path and are inert until it is run.
  - >-
    THE ORTHOGONAL ARM MUST BE ddG, NOT SHAPE COMPLEMENTARITY. The two tasks invert. For
    binder-vs-non-binder the AF confidence metrics win (i_pAE AUROC 0.769) and the Rosetta static
    descriptors are at chance (SC 0.532, n_InterfaceHbonds 0.523, dSASA 0.508, all CIs spanning 0.5).
    For parent-vs-mutant - which is OUR task - it reverses: delta-AF2 mean_pae is random at 0.54 and
    delta-AF3 ipTM 0.72, while SSIPe 0.78, FlexddG 0.77 and FoldX 0.74 do better. This is why B3 is
    ddG and why the static descriptors are dropped outright.
  - >-
    STAGING RECOMMENDATION: run 1501 first. Both of its epitope cores are entirely off-interface
    (no anchor pocket touches a contact residue), so it is the clean test of whether the v2 lock set
    still permits de-immunization. 0401 is the harder case - its single core sits at idx0b 7-15 with
    P9 = G15 a contact anchor and P1 = idx 7 in the shell, leaving only P4 and P6.
  - >-
    OPEN BEFORE EXECUTION: (a) DONE - the v2 manifest is authored and round-trip validated;
    (b) decide the Protenix-only vs AF2-repredict path; (c) decide whether B3 is in; (d) fix the
    mutation budget as a hard cap or a reported target. The last three still need a decision, not
    a script.
  - >-
    ONE FREE POCKET IS NOT BEING USED. In 200 DRB1*15:01 designs the LVKYLGISR P6 pocket (idx0b 57,
    a GLYCINE) is mutated exactly 0 times, so that epitope is being attacked through P9 alone
    (164/200). Admissibility said it had two free pockets; the sampler is effectively using one.
    This is the brittle-single-position case the protocol warns about, arrived at empirically rather
    than by construction - if the P9 substitutions turn out not to clear the epitope, P6 is a Gly
    the DPLM prior refuses to move and there is no third option under this lock set.
  - >-
    ROSETTA dG ON AN UNREPACKED BINDER COMPLEX IS NOT A BINDING ENERGY. Under the pipeline's
    settings (-pack_input false -pack_separated false) the PARENT's own dG_separated is +9.45 REU on
    a 2486 A2 interface - positive, i.e. Rosetta scores the true complex as unfavorable, because the
    predicted side chains are never repacked. Uricase's buried tetramer interfaces hid this behind
    large favorable terms (-155 REU). Only the _delta_vs_wt form is interpretable here, which is
    also what the B3 evidence table independently concludes.
  - >-
    KNOWN DEFECT CARRIED OVER FROM v1: the binder chain in PDB_ROOT was extracted from the Protenix
    complex CIF without B-factors, so reference_pLDDT reads 0.00. Coordinates are correct and no gate
    consumed it. Fix before the v2 run.
