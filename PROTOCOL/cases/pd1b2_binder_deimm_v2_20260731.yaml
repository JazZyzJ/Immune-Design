  b0_sctm_min: 0.956
  b0_parent_sctm: 0.976
  b0_anchor_scrmsd_role: monitor only - the parent's own worst structured-anchor value is 4.00 A, so this metric has no resolving power on this target
  b0_anchor_min_plddt_role: monitor only - dominated by the mobile N-terminal segment (parent value 40.1 at idx0b 0)

  # B1 complex formation -- HARD. Protenix-only path is SELF-CALIBRATED (see notes)
  b1_predictor_primary: Protenix complex, 5 samples, RTX PRO 6000 Blackwell (sm_120) with the
    v2.0.0-blackwell env - the parent baseline is re-measured on the SAME architecture as the designs
  b1_parent_iptm: 0.9552
  b1_parent_iptm_sample_spread: 0.0004
  b1_parent_iptm_h200_superseded: 0.9507
  b1_cross_architecture_iptm_shift: 0.0046
  b1_iptm_absolute_floor: 0.90
  b1_has_clash_required: false
  b1_af2_repredict_optional_i_pae_max: 0.20
  b1_af2_repredict_optional_i_pae_max_raw_ang: 6.2
  b1_parent_af2_i_pae: 0.18
  b1_parent_af2_i_pae_raw_ang: 5.6
  b1_parent_af2_i_ptm: 0.790

  # B2 interface identity -- HARD. CORRECTED after the v2 cohort: retention, not symmetric Jaccard
  b2_statistic: parent-contact retention |C_design & C_parent| / |C_parent|
  b2_parent_contact_retention_min: 0.952
  b2_parent_contact_retention_min_as_counts: 'lose at most 1 of the parent consensus contacts'
  b2_parent_consensus_n_contacts: 21
  b2_parent_consensus_n_contacts_h200_superseded: 24
  b2_symmetric_jaccard_role: monitor only - see notes, it is 95% a measure of contacts GAINED
  b2_symmetric_jaccard_min_superseded: 0.85
  b2_parent_consensus_leave_one_out_jaccard: 1.0
  b2_parent_sample_pairwise_jaccard_median: 0.808
  b2_parent_sample_pairwise_jaccard_min: 0.731

  # B3 ddG_bind -- OPTIONAL orthogonal arm
  b3_method: FlexddG or SSIPe (NOT static Rosetta interface descriptors)
  b3_no_effect_band_kcal_per_mol: 1.0
  b3_status: optional; decide before the run, not after

  # dropped as gates (AUROC at chance on BindCraft's own labelled data)
  dropped_gates: ShapeComplementarity, dSASA, n_InterfaceHbonds, n_InterfaceResidues, Hotspot_RMSD

  # ============================ STAGE 3 - IMMUNE ============================
  immune_hard_strong_windows_covering_contact_anchors: 0
  immune_parent_strong_windows_covering_contact_anchors: 6
  immune_target_strong_count_drb0401_below: 6
  immune_target_strong_count_drb1501_below: 15
  immune_guard: no NEW epitope whose anchor pockets fall in the contact or shell set
  immune_role: objective ranked WITHIN the B0-B2 survivors, never a filter applied before them

  # ============================ MUTATION BUDGET ============================
  budget_rf_stage_expected: 25
  budget_refined_target_max: 10
  budget_literature_range: 1-9 simultaneous mutations in every campaign that preserved function

