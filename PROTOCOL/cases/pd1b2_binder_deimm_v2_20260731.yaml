tag: pd1b2_binder_deimm_v2_20260731
date: 2026-07-31
goal: >-
  De-immunize PD1_b2 (114-aa BindCraft binder vs PD-1) under the RIGOROUS construction: freeze the
  interface AND its 8 A support shell at generation time (57 of 114 positions), then decide binding
  on a re-predicted COMPLEX rather than on a monomer. Supersedes the v1 framing, whose lock set
  (24 positions, 21%) left a median of 41 mutations per design and whose binding evidence was
  monomer-only. The v1 cohort is retained as the empirical mutation-tolerance map that motivated
  this lock set.
protocol: PROTOCOL/binder_interface_deimm_selection.md
runner: PROTOCOL/binder_interface_deimm_selection.md
status: selected
supersedes: pd1b2_binder_deimm_20260731

