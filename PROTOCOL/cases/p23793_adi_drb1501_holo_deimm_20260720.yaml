notes:
  - >-
    THIS IS THE TEMPLATE FOR AN ORDINARY TARGET. Compared with the ADA case, T1 (metal) and T2 (TS
    analogue) are absent because the chemistry has neither, leaving T0 plus one substrate complex.
    Copy this file, not the ADA one, for a metal-independent single-substrate enzyme.
  - >-
    All 10 candidates passed - a 100% pass rate is a WEAK result, not a strong one. It means this
    gate did not discriminate within this cohort, either because the shortlist was already
    structurally excellent or because a 4.0 A contact criterion on 5 samples is too permissive to
    separate candidates. Do not read it as validation of the gate's power.
  - >-
    RAW RMSD IS AN ARTIFACT DETECTOR, NOT A METRIC. In the neutral-state run the raw pairwise ligand
    RMSD median was 0.94 A but the symmetry-aware value was 0.11 A - the apparent spread was entirely
    guanidinium NH1/NH2 and carboxylate O/OXT atom-naming symmetry. Always report symmetry-aware.
  - >-
    Protonation robustness was established AT THE WT LEVEL ONLY: the +1 and neutral states give
    identical group consensus sets (Jaccard 1.00 each), salt bridges within 0.06 A, catalytic
    distances within 0.05 A. The decision rule's remaining clause - candidate RANKING stability
    between the two states - was unevaluable when the baseline was run (no candidates existed) and
    has still not been checked on these 10. It is the open item for this target.
  - >-
    ASSEMBLY CAVEAT: the native state is an A2 homodimer whose interface borders the substrate
    channel, so monomer-only refolding is EXPLORATORY. An assembly-return check and an experimental
    oligomeric-state assay are required before claiming retained activity.
  - >-
    The looser T0 floor (cat_max 3.3 A, pLDDT 81 vs ADA's 1.0 / 90) is not a relaxation of standards
    - it is calibrated on this protein's own WT self-consistency (0.82 A vs ADA's 0.27 A). Holding
    ADI to ADA's numbers would fail the positive control.
  - >-
    Evidence boundary: computational candidates only. Donor PBMC / CD4 T-cell assays and an
    arginine-deiminase activity assay are still required.
