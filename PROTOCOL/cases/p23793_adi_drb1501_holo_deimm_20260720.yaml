criteria:
  # --- ligand state: the PRIMARY physiological zwitterion; the neutral form is a control only ---
  ligand_state_id_primary: L_ARG_PHYS_QP1
  ligand_state_id_sensitivity_control: L_ARG_NEUTRAL_PUBCHEM
  ligand_formal_charge: 1

  # --- T0 apo (hard); the ADI floor is looser than ADA's because WT self-consistency is looser ---
  t0_sctm_min: 0.94
  t0_cat_max_scrmsd_max: 3.3
  t0_active_site_min_plddt_min: 81.0
  t0_wt_selfconsistency_active_site_scrmsd: 0.82

  # --- T1 / T2 do not exist for this target ---
  t1_metal_coordination: not applicable - ADI is metal-independent
  t2_transition_state_analogue: not applicable - no TS analogue reagent (PRH is ADA-only)

  # --- substrate recognition: group-aware fingerprint (groups by CONNECTIVITY, not atom names) ---
  guanidinium_partners: D161, D271
  carboxylate_partners: R180, R232
  alpha_ammonium_partners: L44, N155, G392
  contact_cutoff_ang: 4.0
  min_samples_per_partner: 4
  n_samples: 5
  catalytic_c398_sg_to_guanidinium_cz_median_max_ang: 4.0
  wt_c398_sg_to_cz_ang: 2.98

  raw_rmsd_role: monitor only - report the symmetry-aware value (guanidinium NH1/NH2 and carboxylate O/OXT exchange permitted)
  immune_role: hard prefilter (core_count_after == 0), never a ranker

