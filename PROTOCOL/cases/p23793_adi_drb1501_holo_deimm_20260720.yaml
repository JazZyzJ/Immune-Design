  recognition, by running the holo protocol's REDUCED form on the 0-NMP refinement shortlist.
  ADI is the ORDINARY instantiation: no metal cofactor and no transition-state analogue, so only
  T0 plus a single-ligand substrate check applies - T1 and T2 are structurally absent, not skipped.
  The discriminating metric is a group-aware interaction fingerprint, not a pose RMSD.
